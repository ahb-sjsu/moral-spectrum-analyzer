name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests web

      - name: Format check (black)
        run: black --check src tests web

      - name: Type check (ty)
        # ty is pre-1.0 (Astral); run it for signal but don't gate the build on an
        # alpha type-checker's churn.
        continue-on-error: true
        run: ty check src

      - name: Test (pytest + coverage)
        run: pytest --cov=moral_spectrum --cov-report=term-missing

      # The audit claim is that a third party can re-verify a decision record
      # without our code, and web/verify.js is the evidence for it. Nothing here
      # ran that, so a change to verify.js could silently stop agreeing with
      # Python while every Python check stayed green. This runs the JS verifier
      # against the committed corpus: 29 records, byte-identical canonical form,
      # and four kinds of tampering that must be rejected.
      - uses: actions/setup-node@v4
        if: matrix.python-version == '3.12'
        with:
          node-version: '20'

      - name: Verify the audit proofs in JavaScript
        if: matrix.python-version == '3.12'
        run: node web/test_verify.mjs

  # The twin's escalation ladder, emergency-services gate, reflexes and force rules
  # (tests/test_twin_ladder.py, docs/AUTONOMY_PLAN.md sections 3b-3d) run on the compiler's scene
  # runtime, which is newer than the erisml-compiler release on PyPI. The job above skips that file;
  # this one installs erisml-compiler from main and runs it.
  twin:
    name: twin ladder (erisml-compiler main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # main carries the same version number as the PyPI release, so force the reinstall
          pip install --force-reinstall --no-deps "erisml-compiler @ git+https://github.com/ahb-sjsu/erisml-compiler@main"
          # DEME, the output ethics layer (twin/output_gate.py)
          pip install "erisml-lib @ git+https://github.com/ahb-sjsu/erisml-lib@main"
          # the robot's model tiers ride agi-hpc's vMOE cascade (twin/cascade.py); only
          # agi.primer is used, so its heavy dependencies are not needed
          pip install openai
          pip install --no-deps "agi-hpc @ git+https://github.com/ahb-sjsu/agi-hpc@main"

      - name: Test the twin's boundaries
        env:
          TWIN_TESTS_REQUIRED: "1"  # here a missing scene runtime is a failure, not a skip
        run: pytest tests/test_twin_ladder.py tests/test_ieip_labeller.py tests/test_ieip_analysis.py -v
